<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Quiz App</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-card {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .quiz-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .title {
            font-weight: 700;
            color: #222;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
        }

        .progress {
            height: 8px;
            border-radius: 20px;
            margin: 25px 0;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .question-number {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
        }

        .question {
            font-size: 22px;
            font-weight: 600;
            color: #222;
            margin: 12px 0 25px;
        }

        .option {
            width: 100%;
            text-align: left;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-radius: 13px;
            border: 2px solid #eee;
            background: white;
            color: #333;
            font-size: 15px;
            transition: 0.25s;
            cursor: pointer;
        }

        .option:hover {
            border-color: #667eea;
            background: #f7f7ff;
            transform: translateX(4px);
        }

        .option.correct {
            background: #d1e7dd;
            border-color: #198754;
            color: #146c43;
        }

        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #b02a37;
        }

        .option.disabled {
            pointer-events: none;
        }

        .next-btn {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .score-screen {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            margin: 25px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.3);
        }

        .score-number {
            font-size: 40px;
            font-weight: 700;
        }

        .score-text {
            font-size: 13px;
        }

        .result-message {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .restart-btn {
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            background: #222;
            color: white;
            font-weight: 600;
            margin-top: 15px;
        }

        .restart-btn:hover {
            background: #444;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 500px) {
            .quiz-card {
                padding: 25px 18px;
            }

            .question {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-card">

        <!-- Quiz Header -->
        <div id="quizScreen">

            <div class="text-center">

                <div class="quiz-icon">
                    🧠
                </div>

                <h2 class="title">
                    Mini Quiz
                </h2>

                <p class="subtitle">
                    Test your basic programming knowledge
                </p>

            </div>


            <!-- Progress -->
            <div class="d-flex justify-content-between">

                <span
                    class="question-number"
                    id="questionNumber"
                >
                    Question 1 of 5
                </span>

                <span
                    class="question-number"
                    id="scoreDisplay"
                >
                    Score: 0
                </span>

            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                    style="width: 20%"
                ></div>

            </div>


            <!-- Question -->
            <div id="question" class="question">
                Loading question...
            </div>


            <!-- Options -->
            <div id="options"></div>


            <!-- Next -->
            <button
                id="nextButton"
                class="next-btn"
                onclick="nextQuestion()"
                disabled
            >
                Next Question →
            </button>

        </div>


        <!-- Score Screen -->
        <div id="scoreScreen" class="score-screen">

            <div class="quiz-icon">
                🏆
            </div>

            <h2 class="title">
                Quiz Completed!
            </h2>

            <p class="subtitle">
                Great job! Here is your result.
            </p>


            <div class="score-circle">

                <div
                    id="finalScore"
                    class="score-number"
                >
                    0/5
                </div>

                <div class="score-text">
                    Your Score
                </div>

            </div>


            <div
                id="resultMessage"
                class="result-message"
            >
                Keep learning!
            </div>


            <button
                class="restart-btn"
                onclick="restartQuiz()"
            >
                🔄 Restart Quiz
            </button>

        </div>


        <div class="footer">
            Made with ❤️ using HTML • CSS • JavaScript • Bootstrap
        </div>

    </div>


    <script>

        // Quiz questions
        const questions = [

            {
                question: "Which language is used to style a webpage?",
                options: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "Python"
                ],
                answer: 1
            },

            {
                question: "Which HTML tag is used to create a hyperlink?",
                options: [
                    "<link>",
                    "<href>",
                    "<a>",
                    "<url>"
                ],
                answer: 2
            },

            {
                question: "Which keyword is used to declare a variable in JavaScript?",
                options: [
                    "var",
                    "int",
                    "string",
                    "define"
                ],
                answer: 0
            },

            {
                question: "Which method is used to print something in the browser console?",
                options: [
                    "print()",
                    "console.log()",
                    "display()",
                    "write.log()"
                ],
                answer: 1
            },

            {
                question: "Which framework/library is used to build user interfaces?",
                options: [
                    "React",
                    "MySQL",
                    "MongoDB",
                    "Node"
                ],
                answer: 0
            }

        ];


        // Variables
        let currentQuestion = 0;
        let score = 0;
        let answered = false;


        // Load first question
        loadQuestion();


        // Load question function
        function loadQuestion() {

            answered = false;

            const questionData =
                questions[currentQuestion];


            // Question number
            document.getElementById("questionNumber")
                .textContent =
                `Question ${currentQuestion + 1} of ${questions.length}`;


            // Score
            document.getElementById("scoreDisplay")
                .textContent =
                `Score: ${score}`;


            // Progress
            const progress =
                ((currentQuestion + 1) / questions.length) * 100;

            document.getElementById("progressBar")
                .style.width =
                progress + "%";


            // Question text
            document.getElementById("question")
                .textContent =
                questionData.question;


            // Options container
            const optionsContainer =
                document.getElementById("options");

            optionsContainer.innerHTML = "";


            // Create options
            questionData.options.forEach(
                (option, index) => {

                    const button =
                        document.createElement("button");

                    button.className = "option";

                    button.textContent = option;

                    button.onclick = () =>
                        selectAnswer(index, button);

                    optionsContainer.appendChild(button);

                }
            );


            // Disable next button
            document.getElementById("nextButton")
                .disabled = true;

        }


        // Select answer
        function selectAnswer(selectedIndex, selectedButton) {

            if (answered) {
                return;
            }

            answered = true;


            const correctIndex =
                questions[currentQuestion].answer;


            const allOptions =
                document.querySelectorAll(".option");


            // Disable all options
            allOptions.forEach(option => {

                option.classList.add("disabled");

            });


            // Correct answer
            if (selectedIndex === correctIndex) {

                selectedButton.classList.add("correct");

                score++;

                document.getElementById("scoreDisplay")
                    .textContent =
                    `Score: ${score}`;

            }

            // Wrong answer
            else {

                selectedButton.classList.add("wrong");

                allOptions[correctIndex]
                    .classList.add("correct");

            }


            // Enable next button
            document.getElementById("nextButton")
                .disabled = false;

        }


        // Next question
        function nextQuestion() {

            currentQuestion++;


            if (currentQuestion < questions.length) {

                loadQuestion();

            }

            else {

                showResult();

            }

        }


        // Show final result
        function showResult() {

            document.getElementById("quizScreen")
                .style.display = "none";

            document.getElementById("scoreScreen")
                .style.display = "block";


            document.getElementById("finalScore")
                .textContent =
                `${score}/${questions.length}`;


            const percentage =
                (score / questions.length) * 100;


            let message;


            if (percentage === 100) {

                message = "🔥 Perfect Score! Excellent!";

            }

            else if (percentage >= 80) {

                message = "🎉 Great Job!";

            }

            else if (percentage >= 50) {

                message = "👍 Good Try! Keep Learning!";

            }

            else {

                message = "💪 Don't Give Up! Practice More!";

            }


            document.getElementById("resultMessage")
                .textContent = message;

        }


        // Restart quiz
        function restartQuiz() {

            currentQuestion = 0;

            score = 0;

            document.getElementById("quizScreen")
                .style.display = "block";

            document.getElementById("scoreScreen")
                .style.display = "none";

            loadQuestion();

        }

    </script>

</body>
</html>
