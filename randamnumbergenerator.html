<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Number Generator</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .generator-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .title {
            font-weight: 700;
            color: #222;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 2px solid #eee;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
        }

        .result-box {
            margin-top: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            color: white;
        }

        .result-label {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        #result {
            font-size: 55px;
            font-weight: 700;
            margin: 0;
        }

        .animate-result {
            animation: pop 0.35s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .generate-btn {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .secondary-btn {
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 500;
        }

        .stats {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            color: #777;
            font-size: 13px;
        }

        .stats strong {
            color: #333;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        @media (max-width: 500px) {
            .generator-card {
                padding: 25px 20px;
            }

            #result {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <div class="generator-card">

        <!-- Header -->
        <div class="text-center">

            <div class="icon">
                🎲
            </div>

            <h2 class="title">
                Random Number
            </h2>

            <p class="subtitle">
                Generate a random number between your range
            </p>

        </div>


        <!-- Inputs -->
        <div class="row g-3 mt-2">

            <div class="col-6">

                <label
                    for="minNumber"
                    class="form-label"
                >
                    Minimum
                </label>

                <input
                    type="number"
                    id="minNumber"
                    class="form-control"
                    value="1"
                    placeholder="Enter minimum"
                >

            </div>


            <div class="col-6">

                <label
                    for="maxNumber"
                    class="form-label"
                >
                    Maximum
                </label>

                <input
                    type="number"
                    id="maxNumber"
                    class="form-control"
                    value="100"
                    placeholder="Enter maximum"
                >

            </div>

        </div>


        <!-- Error -->
        <div
            id="errorMessage"
            class="error-message"
        >
            Please enter a valid range.
        </div>


        <!-- Generate Button -->
        <button
            class="generate-btn mt-4"
            onclick="generateNumber()"
        >
            🎲 Generate Number
        </button>


        <!-- Result -->
        <div class="result-box">

            <div class="result-label">
                YOUR RANDOM NUMBER
            </div>

            <p id="result">
                50
            </p>

        </div>


        <!-- Buttons -->
        <div class="d-flex gap-2 mt-3">

            <button
                class="btn btn-outline-primary secondary-btn flex-fill"
                onclick="copyNumber()"
            >
                📋 Copy
            </button>

            <button
                class="btn btn-outline-secondary secondary-btn flex-fill"
                onclick="resetGenerator()"
            >
                🔄 Reset
            </button>

        </div>


        <!-- Statistics -->
        <div class="stats">

            <span>
                Generations:
                <strong id="count">0</strong>
            </span>

            <span>
                Last:
                <strong id="lastNumber">50</strong>
            </span>

        </div>


        <div class="footer">
            Made with ❤️ using HTML • CSS • JavaScript • Bootstrap
        </div>

    </div>


    <!-- JavaScript -->
    <script>

        // Generation counter
        let generationCount = 0;


        // Generate random number
        function generateNumber() {

            const minInput =
                document.getElementById("minNumber");

            const maxInput =
                document.getElementById("maxNumber");

            const result =
                document.getElementById("result");

            const error =
                document.getElementById("errorMessage");

            const min = Number(minInput.value);
            const max = Number(maxInput.value);


            // Validate input
            if (
                minInput.value === "" ||
                maxInput.value === "" ||
                min > max
            ) {

                error.style.display = "block";

                return;

            }


            error.style.display = "none";


            // Generate random number
            const randomNumber =
                Math.floor(
                    Math.random() * (max - min + 1)
                ) + min;


            // Display result
            result.textContent = randomNumber;


            // Animation
            result.classList.remove("animate-result");

            void result.offsetWidth;

            result.classList.add("animate-result");


            // Update counter
            generationCount++;

            document.getElementById("count").textContent =
                generationCount;

            document.getElementById("lastNumber").textContent =
                randomNumber;

        }


        // Copy number
        function copyNumber() {

            const number =
                document.getElementById("result").textContent;

            navigator.clipboard.writeText(number)
                .then(() => {

                    showMessage("Number copied! 📋");

                })
                .catch(() => {

                    showMessage("Unable to copy!");

                });

        }


        // Reset generator
        function resetGenerator() {

            document.getElementById("minNumber").value = 1;

            document.getElementById("maxNumber").value = 100;

            document.getElementById("result").textContent = 50;

            document.getElementById("count").textContent = 0;

            document.getElementById("lastNumber").textContent = 50;

            document.getElementById("errorMessage").style.display =
                "none";

            generationCount = 0;

        }


        // Enter key support
        document.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                generateNumber();

            }

        });


        // Simple message
        function showMessage(message) {

            const oldMessage =
                document.querySelector(".message");

            if (oldMessage) {
                oldMessage.remove();
            }


            const messageBox =
                document.createElement("div");

            messageBox.className =
                "message alert alert-success position-fixed";

            messageBox.style =
                "top:20px; right:20px; z-index:9999; border-radius:12px;";

            messageBox.textContent = message;

            document.body.appendChild(messageBox);


            setTimeout(() => {

                messageBox.remove();

            }, 1800);

        }

    </script>

</body>
</html>
