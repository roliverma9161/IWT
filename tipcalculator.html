<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tip Calculator</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .calculator {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .left-section {
      padding: 40px;
    }

    .right-section {
      background: #171717;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .title {
      font-weight: 700;
      color: #171717;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-group-text {
      background: #f1f1f1;
      border: none;
      font-weight: 600;
    }

    .form-control {
      border: 1px solid #ddd;
      padding: 12px;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #667eea;
    }

    .tip-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tip-btn {
      border: none;
      background: #222;
      color: white;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
    }

    .tip-btn:hover,
    .tip-btn.active {
      background: #667eea;
    }

    .result-box {
      margin-bottom: 25px;
    }

    .result-label {
      color: #aaa;
      font-size: 13px;
    }

    .result-value {
      font-size: 30px;
      font-weight: 700;
    }

    .per-person {
      font-size: 12px;
      color: #aaa;
    }

    .reset-btn {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-weight: 600;
      transition: 0.3s;
    }

    .reset-btn:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    .tip-display {
      background: #f5f5f5;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }

    @media (max-width: 767px) {
      .left-section,
      .right-section {
        padding: 30px 25px;
      }

      .tip-buttons {
        grid-template-columns: repeat(2, 1fr);
      }

      .result-value {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="row g-0">

      <!-- LEFT SIDE -->
      <div class="col-md-7 left-section">

        <h2 class="title">Tip Calculator</h2>

        <p class="subtitle mb-4">
          Calculate your tip and split the bill easily.
        </p>

        <!-- Bill -->
        <div class="mb-4">

          <label>Bill Amount</label>

          <div class="input-group">
            <span class="input-group-text">₹</span>

            <input
              type="number"
              id="bill"
              class="form-control"
              placeholder="Enter bill amount"
              min="0"
            >
          </div>

        </div>

        <!-- Tip -->
        <div class="mb-4">

          <label>Select Tip</label>

          <div class="tip-buttons">

            <button class="tip-btn" onclick="selectTip(5, this)">
              5%
            </button>

            <button class="tip-btn" onclick="selectTip(10, this)">
              10%
            </button>

            <button class="tip-btn" onclick="selectTip(15, this)">
              15%
            </button>

            <button class="tip-btn" onclick="selectTip(20, this)">
              20%
            </button>

            <button class="tip-btn" onclick="selectTip(25, this)">
              25%
            </button>

            <button class="tip-btn" onclick="selectTip(30, this)">
              30%
            </button>

          </div>

          <div class="tip-display">
            Selected Tip:
            <strong id="tipText">0%</strong>
          </div>

        </div>

        <!-- Custom Tip -->
        <div class="mb-4">

          <label>Custom Tip %</label>

          <input
            type="number"
            id="customTip"
            class="form-control"
            placeholder="Example: 18"
            min="0"
          >

        </div>

        <!-- People -->
        <div class="mb-4">

          <label>Number of People</label>

          <input
            type="number"
            id="people"
            class="form-control"
            value="1"
            min="1"
          >

        </div>

      </div>


      <!-- RIGHT SIDE -->
      <div class="col-md-5 right-section">

        <div>

          <h5 class="mb-4">
            Bill Summary
          </h5>

          <!-- Tip -->
          <div class="result-box">

            <div class="d-flex justify-content-between align-items-center">

              <div>
                <div class="result-label">
                  Tip Amount
                </div>

                <div class="per-person">
                  / person
                </div>
              </div>

              <div class="result-value">
                ₹<span id="tipAmount">0.00</span>
              </div>

            </div>

          </div>


          <!-- Total -->
          <div class="result-box">

            <div class="d-flex justify-content-between align-items-center">

              <div>
                <div class="result-label">
                  Total
                </div>

                <div class="per-person">
                  / person
                </div>
              </div>

              <div class="result-value">
                ₹<span id="totalAmount">0.00</span>
              </div>

            </div>

          </div>


          <!-- Full Bill -->
          <div class="result-box">

            <div class="d-flex justify-content-between">

              <div class="result-label">
                Full Bill
              </div>

              <div>
                ₹<span id="fullBill">0.00</span>
              </div>

            </div>

          </div>

        </div>


        <!-- Reset -->
        <button class="reset-btn" onclick="resetCalculator()">
          Reset
        </button>

      </div>

    </div>

  </div>


  <script>

    let selectedTip = 0;

    const billInput = document.getElementById("bill");
    const customTipInput = document.getElementById("customTip");
    const peopleInput = document.getElementById("people");

    const tipAmount = document.getElementById("tipAmount");
    const totalAmount = document.getElementById("totalAmount");
    const fullBill = document.getElementById("fullBill");
    const tipText = document.getElementById("tipText");


    // Select tip percentage
    function selectTip(value, button) {

      selectedTip = value;

      customTipInput.value = "";

      document.querySelectorAll(".tip-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      tipText.textContent = value + "%";

      calculate();
    }


    // Calculate
    function calculate() {

      const bill = parseFloat(billInput.value) || 0;

      const people = parseInt(peopleInput.value) || 1;

      let tipPercentage = selectedTip;

      // Custom tip
      if (customTipInput.value !== "") {

        tipPercentage =
          parseFloat(customTipInput.value) || 0;

        document.querySelectorAll(".tip-btn").forEach(btn => {
          btn.classList.remove("active");
        });

        tipText.textContent = tipPercentage + "%";
      }

      const tip = bill * (tipPercentage / 100);

      const total = bill + tip;

      const tipPerPerson = tip / people;

      const totalPerPerson = total / people;


      tipAmount.textContent =
        tipPerPerson.toFixed(2);

      totalAmount.textContent =
        totalPerPerson.toFixed(2);

      fullBill.textContent =
        total.toFixed(2);
    }


    // Reset calculator
    function resetCalculator() {

      billInput.value = "";

      customTipInput.value = "";

      peopleInput.value = 1;

      selectedTip = 0;

      tipText.textContent = "0%";

      tipAmount.textContent = "0.00";

      totalAmount.textContent = "0.00";

      fullBill.textContent = "0.00";

      document.querySelectorAll(".tip-btn").forEach(btn => {
        btn.classList.remove("active");
      });
    }


    // Real-time calculation
    billInput.addEventListener("input", calculate);

    customTipInput.addEventListener("input", calculate);

    peopleInput.addEventListener("input", calculate);

  </script>

</body>
</html>
