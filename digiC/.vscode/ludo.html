<html>
    <head>
        <meta> <charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>LUDO DESIGN</title>
        <style>
            *
            {
                margin:0;
                padding:0;
            }
            .buter
            {
                height: 750px;
                width: 750px;
                border: 1px solid red;
                margin: 0px auto;
            }
            .box_row
            {
                height: 300px;
                width: 750px;
                //background: #ff7474;
            }
            .box
            {
                height: 200px;
                width: 200px;
                float:left;
            }
            .border_red
            {
                border:50px solid red;
            }
            .border_green
            {
                border:50px solid green;
            }
            .border_blue
            {
                border: 50px solid blue;
            }
            .border_yellow
            {
                border:50px solid yellow;
            }
            .circle
            {
                height: 50px;
                width:50px;
                border:5px solid red;
                box-sizing:border-box;
                border-radius: 50%;
                margin: 25px;
                float:left;
            }
            .v_lad
            {
                height: 300px;
                width: 150px;
                float:left;
                //background:#ff8596;
            }
            .v_lad_row
            {
                height: 50px;
                width: 150px;
               // background:#ff4144;
            }
            .cell
            {
                height:50px;
                width: 50px;
                float:left;
                box-sizing:border-box;
                border:1px solid #000;
            }


            
        </style>
    </head>
    <body>
        <div class="outer">
            <div class="box_row">
                <div class="box border_red">
                    <div class="circle"  style="border:5px solid red"></div>
                        <div class="circle" style="border:5px solid red" ></div>
                            <div class="circle" style="border:5px solid red" ></div>
                                <div class="circle"  style="border:5px solid red"></div>
                </div>
            </div>
            <div class="v_lad">
                <div class="v_lad_row">
                    <div class="cell"></div>
                </div>
            </div>
            <div class="box_row">
                <div class="box border_green">
                    <div class="circle"  style="border:5px solid green"></div>
                    <div class="circle"  style="border:5px solid green"></div>
                    <div class="circle"  style="border:5px solid green"></div>
                    <div class="circle"  style="border:5px solid green"></div>
                </div>
            <div class="box_row">
                <div class="box border_yellow">
                    
            
            </div>
        </div>
         </div>

    </body>
    </html>
