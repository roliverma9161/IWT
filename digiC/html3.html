<html>
    <head>
        <style>
            div{
                height:100px;
                width:100px;
                background-color:yellow;
                animation-name:example;
                animation-duration:4s;
            }
            @keyframes example{
                0%{background-color:red;}
                25%{background-color:green;}
                50%{background-color:black;}
                100%{background-color:blue;}
            }
            </style>
        <body>
            <div></div>
        </body>
    </head>
</html>
