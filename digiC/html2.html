<html>
    <head>
        <style>
            div{
                height:100px;
                width:100px;
                background:red;
                animation-name:example;
                animation-duration:4s;
                animation-iteration-count: infinite;
            }
            @keyframes example {
                from{
                    background-color:red;
                    height:100px;
                    width:100px;
                    rotate:0deg;
                    transform:translate(82px);
                }
                to{background-color:yellow;
                    height:500px;
                    width:500px;
                    rotate:180deg;
                    transform:translate(82px,0) ;
                }
                
            }
            </style>
              </head>
                <body>
                    <div>
                        hello
                    </div>
                    </body>
                </html>
