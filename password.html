<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
        }

        .generator-card {
            width: 100%;
            max-width: 520px;

            background: rgba(255, 255, 255, 0.96);

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 34px;
        }

        .title {
            margin-top: 18px;

            font-weight: 700;

            color: #222;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
        }

        .password-box {
            display: flex;

            gap: 8px;

            margin-top: 25px;
        }

        #password {
            flex: 1;

            border: 2px solid #eee;

            border-radius: 12px;

            padding: 13px;

            font-size: 16px;

            font-weight: 600;

            outline: none;
        }

        #password:focus {
            border-color: #667eea;
        }

        .copy-btn {
            border: none;

            padding: 0 18px;

            border-radius: 12px;

            background: #222;

            color: white;

            font-size: 18px;
        }

        .copy-btn:hover {
            background: #444;
        }

        .length-value {
            font-weight: 600;
            color: #667eea;
        }

        .form-range {
            cursor: pointer;
        }

        .option-box {
            margin-top: 20px;

            padding: 18px;

            background: #f7f7fb;

            border-radius: 15px;
        }

        .form-check {
            margin-bottom: 10px;
        }

        .form-check:last-child {
            margin-bottom: 0;
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check-label {
            cursor: pointer;

            font-size: 14px;

            color: #333;
        }

        .generate-btn {
            width: 100%;

            margin-top: 22px;

            padding: 13px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-weight: 600;

            transition: 0.3s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .strength-container {
            margin-top: 20px;
        }

        .strength-title {
            display: flex;
            justify-content: space-between;

            font-size: 13px;

            margin-bottom: 8px;

            color: #555;
        }

        .strength-bar {
            height: 8px;

            background: #eee;

            border-radius: 20px;

            overflow: hidden;
        }

        #strengthFill {
            height: 100%;

            width: 0%;

            transition: 0.4s;
        }

        #strengthText {
            font-weight: 600;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #999;
        }

        @media (max-width: 500px) {

            .generator-card {
                padding: 25px 18px;
            }

            .password-box {
                flex-direction: column;
            }

            .copy-btn {
                padding: 11px;
            }
        }

    </style>
</head>

<body>


    <div class="generator-card">

        <!-- Header -->

        <div class="text-center">

            <div class="icon">
                🔐
            </div>

            <h2 class="title">
                Password Generator
            </h2>

            <p class="subtitle">
                Create a strong and secure password
            </p>

        </div>


        <!-- Password -->

        <div class="password-box">

            <input
                type="text"
                id="password"
                value=""
                placeholder="Your password"
                readonly
            >

            <button
                class="copy-btn"
                onclick="copyPassword()"
                title="Copy Password"
            >
                📋
            </button>

        </div>


        <!-- Password Length -->

        <div class="mt-4">

            <div class="d-flex justify-content-between">

                <label class="form-label fw-semibold">
                    Password Length
                </label>

                <span
                    id="lengthValue"
                    class="length-value"
                >
                    12
                </span>

            </div>

            <input
                type="range"
                id="length"
                class="form-range"
                min="4"
                max="30"
                value="12"
                oninput="updateLength()"
            >

        </div>


        <!-- Options -->

        <div class="option-box">

            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="uppercase"
                    checked
                >

                <label
                    class="form-check-label"
                    for="uppercase"
                >
                    Include Uppercase Letters (A-Z)
                </label>

            </div>


            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="lowercase"
                    checked
                >

                <label
                    class="form-check-label"
                    for="lowercase"
                >
                    Include Lowercase Letters (a-z)
                </label>

            </div>


            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="numbers"
                    checked
                >

                <label
                    class="form-check-label"
                    for="numbers"
                >
                    Include Numbers (0-9)
                </label>

            </div>


            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="symbols"
                    checked
                >

                <label
                    class="form-check-label"
                    for="symbols"
                >
                    Include Symbols (!@#$%)
                </label>

            </div>

        </div>


        <!-- Strength -->

        <div class="strength-container">

            <div class="strength-title">

                <span>
                    Password Strength
                </span>

                <span id="strengthText">
                    -
                </span>

            </div>

            <div class="strength-bar">

                <div id="strengthFill"></div>

            </div>

        </div>


        <!-- Generate -->

        <button
            class="generate-btn"
            onclick="generatePassword()"
        >
            🔑 Generate Password
        </button>


        <!-- Footer -->

        <div class="footer">

            Made with ❤️ using
            HTML • CSS • JavaScript • Bootstrap

        </div>

    </div>


    <script>

        // Character sets

        const uppercase =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        const lowercase =
            "abcdefghijklmnopqrstuvwxyz";

        const numbers =
            "0123456789";

        const symbols =
            "!@#$%^&*()_+-=[]{}|;:,.<>?";


        // Update password length

        function updateLength() {

            const length =
                document.getElementById("length").value;

            document.getElementById("lengthValue")
                .textContent = length;

        }


        // Generate password

        function generatePassword() {

            const length =
                Number(
                    document.getElementById("length").value
                );


            const useUppercase =
                document.getElementById("uppercase").checked;

            const useLowercase =
                document.getElementById("lowercase").checked;

            const useNumbers =
                document.getElementById("numbers").checked;

            const useSymbols =
                document.getElementById("symbols").checked;


            let characters = "";


            // Add selected characters

            if (useUppercase) {
                characters += uppercase;
            }

            if (useLowercase) {
                characters += lowercase;
            }

            if (useNumbers) {
                characters += numbers;
            }

            if (useSymbols) {
                characters += symbols;
            }


            // Validation

            if (characters.length === 0) {

                alert(
                    "Please select at least one option!"
                );

                return;

            }


            // Generate password

            let password = "";


            for (let i = 0; i < length; i++) {

                const randomIndex =
                    Math.floor(
                        Math.random() * characters.length
                    );

                password +=
                    characters[randomIndex];

            }


            // Display password

            document.getElementById("password")
                .value = password;


            // Update strength

            checkStrength(
                password,
                characters.length
            );

        }


        // Password strength

        function checkStrength(
            password,
            characterCount
        ) {

            const strengthFill =
                document.getElementById("strengthFill");

            const strengthText =
                document.getElementById("strengthText");


            let strength = 0;


            // Length

            if (password.length >= 8) {
                strength++;
            }

            if (password.length >= 12) {
                strength++;
            }


            // Character variety

            if (
                /[A-Z]/.test(password)
            ) {
                strength++;
            }

            if (
                /[a-z]/.test(password)
            ) {
                strength++;
            }

            if (
                /[0-9]/.test(password)
            ) {
                strength++;
            }

            if (
                /[^A-Za-z0-9]/.test(password)
            ) {
                strength++;
            }


            // Display strength

            if (strength <= 2) {

                strengthFill.style.width =
                    "30%";

                strengthText.textContent =
                    "Weak";

            }

            else if (strength <= 4) {

                strengthFill.style.width =
                    "65%";

                strengthText.textContent =
                    "Medium";

            }

            else {

                strengthFill.style.width =
                    "100%";

                strengthText.textContent =
                    "Strong";

            }

        }


        // Copy password

        function copyPassword() {

            const password =
                document.getElementById("password").value;


            if (!password) {

                alert(
                    "Generate a password first!"
                );

                return;

            }


            navigator.clipboard
                .writeText(password)
                .then(() => {

                    alert(
                        "Password copied! 📋"
                    );

                });

        }


        // Generate password when page loads

        generatePassword();

    </script>

</body>

</html>
